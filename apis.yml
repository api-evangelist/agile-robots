name: Agile Robots
description: >-
  Agile Robots SE is a Munich-based robotics and artificial intelligence company founded in 2018 as a
  spin-off from the German Aerospace Center (DLR) Institute of Robotics and Mechatronics. The company
  develops force-sensitive industrial and service robots, robotic arms (Diana series), grippers and hands
  (Agile Hand), mobile robotics, and the AgileCore / AgileAI software platform that lets system integrators
  and operators build and deploy AI-driven automation for the automotive, consumer electronics, healthcare,
  and service industries. Headquartered in Munich's Sendling district with manufacturing across Europe,
  China, and India, Agile Robots reached unicorn valuation in a 2021 Series C and is backed by investors
  including Hongshan (Sequoia Capital China). This profile is maintained in the API Evangelist network;
  Agile Robots does not currently publish a public developer portal, REST API, or first-party SDKs.
